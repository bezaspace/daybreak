services:
  den:
    build:
      context: ./docker/den
    network_mode: host
    privileged: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/den/den.yaml:/etc/den/den.yaml:ro
      - den-store:/etc/den/data
    environment:
      - DEN_SERVER__HOST=127.0.0.1
      - DEN_SERVER__PORT=8080
      - DEN_RUNTIME__DEFAULT_NETWORK_MODE=bridge
      - DEN_RUNTIME__ALLOW_UNSAFE_BRIDGE=true
      - DEN_RUNTIME__NETWORK_ID=den-net
      - DEN_RUNTIME__PLATFORM_OVERRIDE=linux-native-docker-co-resident
      - DEN_SANDBOX__DEFAULT_IMAGE=ubuntu:22.04
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    networks:
      - den-net
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  up-redis:
    image: ghcr.io/coriou/up-redis:latest
    networks:
      - den-net
    ports:
      - "127.0.0.1:8079:8080"
    environment:
      UPREDIS_TOKEN: local-token
      UPREDIS_REDIS_URL: redis://redis:6379
      UPREDIS_PORT: 8080
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:latest
    networks:
      - den-net
    ports:
      - "127.0.0.1:6006:6006"
    environment:
      - PHOENIX_PORT=6006
    volumes:
      - phoenix-data:/phoenix

networks:
  den-net:
    driver: bridge
    name: den-net

volumes:
  den-store:
  redis-data:
  phoenix-data:
